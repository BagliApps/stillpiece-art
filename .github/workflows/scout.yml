# Geçici: aday tarar, sonuçları bu dala ekler. main'de yok.
name: Aday taraması
on:
  push:
    branches: [met-scout]
    paths: [scout/nps.py]
permissions:
  contents: write
jobs:
  scout:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scout/nps.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add scout/out
          git commit -m "NPS taraması sonuçları" && git push

# Geçici: kaynak kıyası için küçük örnek çeker, sonucu bu dala ekler. main'de yok.
name: Kaynak örneği
on:
  push:
    branches: [met-scout]
    paths: [scout/ornek.py]
permissions:
  contents: write
jobs:
  ornek:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scout/ornek.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add scout/out/ornek
          git commit -m "Kaynak örneği" || true
          git pull --rebase --autostash && git push

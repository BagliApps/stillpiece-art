# Eserleri indirir, catalog.json'u yazar, depoya ekler ve GitHub Pages'e
# yayımlar. sources.tsv ya da build.py değişince kendiliğinden çalışır;
# elle de çalıştırılabilir (Actions → "Eserleri kur" → Run workflow).
name: Eserleri kur

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.tsv, build.py, index.html]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow numpy

      # Müzenin toplu verisi (~130 MB) kamu malı denetimi ve künye için;
      # haftada bir tazelenir.
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: aic.tar.bz2
          key: aic-${{ steps.week.outputs.week }}
      - name: Müze verisi
        run: |
          [ -s aic.tar.bz2 ] || curl -fsSL https://artic-api-data.s3.amazonaws.com/artic-api-data.tar.bz2 -o aic.tar.bz2

      - name: Eserleri kur
        run: python3 build.py aic.tar.bz2

      - name: Depoya ekle
        run: |
          git add art thumb catalog.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Eserler güncellendi"
            git push
          fi

      - name: Site
        run: |
          mkdir site
          cp -r art thumb catalog.json index.html site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
